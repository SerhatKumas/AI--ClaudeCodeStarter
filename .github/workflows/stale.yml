## Auto-triage stale issues and PRs. Universal — no language assumptions.
## Tune the day counts and exempt labels to your team's taste, or delete if you
## prefer manual triage.
name: Stale

on:
  schedule:
    - cron: "0 2 * * *" # daily at 02:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security,roadmap"
          exempt-pr-labels: "pinned,security,wip"
          stale-issue-message: >
            This issue has been inactive for 60 days and is now marked stale.
            Comment to keep it open, otherwise it will be closed in 14 days.
          stale-pr-message: >
            This PR has been inactive for 60 days and is now marked stale.
            Push a commit or comment to keep it open, otherwise it will be
            closed in 14 days.
